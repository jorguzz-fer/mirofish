# MiroFish nginx reverse proxy.
# Place at /etc/nginx/sites-available/mirofish.conf, symlink into sites-enabled,
# then run:  sudo certbot --nginx -d your-domain.com
# Certbot rewrites this block to add the HTTPS (443) server + HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # <-- replace with your domain

    # Document uploads can be up to 50MB (see Config.MAX_CONTENT_LENGTH).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Server-Sent Events endpoints (live agent / console logs) need buffering off
    # and long timeouts, otherwise the stream stalls or drops.
    location ~ ^/api/report/.*/(agent-log|console-log)/stream$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
